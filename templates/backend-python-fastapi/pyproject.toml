[tool.poetry]
name = "<%= projectName %>"
version = "0.1.0"
description = "FastAPI backend generated by TemplateGen"
authors = ["Developer <dev@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pydantic = "^2.6.0"
httpx = "^0.27.0"
<% if (database === 'mongodb') { %>motor = "^3.3.2"
<% } else if (database === 'postgresql') { %>psycopg2-binary = "^2.9.9"
<% } else if (database === 'mysql') { %>pymysql = "^1.1.0"
<% } else if (database === 'sqlite') { %>aiosqlite = "^0.20.0"
<% } %>

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
