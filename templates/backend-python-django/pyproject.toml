[tool.poetry]
name = "<%= projectName %>"
version = "0.1.0"
description = "Django backend generated by TemplateGen"
authors = ["Developer <dev@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
django = "^5.0.0"
<% if (database === 'postgresql') { %>psycopg2-binary = "^2.9.9"
<% } else if (database === 'mysql') { %>mysqlclient = "^2.2.4"
<% } %>

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-django = "^4.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
