[tool.poetry]
name = "<%= projectName %>"
version = "0.1.0"
description = "Flask backend generated by TemplateGen"
authors = ["Developer <dev@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
flask = "^3.0.2"
<% if (database === 'mongodb') { %>pymongo = "^4.6.2"
<% } else if (database === 'postgresql') { %>psycopg2-binary = "^2.9.9"
<% } else if (database === 'mysql') { %>pymysql = "^1.1.0"
<% } %>

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
