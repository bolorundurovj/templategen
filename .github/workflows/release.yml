name: Release Please

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: dev
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}

      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC Trusted Publishing
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        run: npm install -g npm@latest

      - name: Sync and verify version from version.ini
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        run: |
          node scripts/sync-version.js
          node scripts/sync-version.js --check

      - name: Check if publish is needed
        id: check_publish
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        run: |
          TARGET_VERSION=$(node -e "import('./scripts/sync-version.js').then(m => console.log(m.readVersionFromIni()))")
          PUBLISHED_VERSION=$(npm view @bolorundurovb/mvcli@$TARGET_VERSION version 2>/dev/null || echo "")
          if [ "$PUBLISHED_VERSION" = "$TARGET_VERSION" ]; then
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "Version $TARGET_VERSION is already published on npm."
          else
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "Version $TARGET_VERSION is not published yet. Proceeding with publish."
          fi

      - run: yarn ci
        if: ${{ steps.check_publish.outputs.should_publish == 'true' }}

      - run: yarn build
        if: ${{ steps.check_publish.outputs.should_publish == 'true' }}

      - name: Configure auth for OIDC or Token
        if: ${{ steps.check_publish.outputs.should_publish == 'true' }}
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "No NPM_TOKEN set, relying on OIDC Trusted Publishing"
            sed -i '/_authToken/d' ~/.npmrc 2>/dev/null || true
          fi

      - run: npm publish --access public --provenance
        if: ${{ steps.check_publish.outputs.should_publish == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
